syntax = "proto3";

package telemetry.message.event;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.telemetry.event";

// запись, предоставляющая данные с датчика движения
message MotionSensorProto {
  int32 link_quality = 1; // качество сигнала связи
  bool motion = 2; // обнаружено ли движение
  int32 voltage = 3; // уровень напряжения
}

// запись, представляющая данные с датчика температуры
message TemperatureSensorProto {
  int32 temperature_c = 1; // уровень температуры по шкале Цельсия
  int32 temperature_f = 2; // уровень температуры по Фаренгейту
}

// запись, представляющая данные с датчика света
message LightSensorProto {
  int32 link_quality = 1; // качество сигнала связи
  int32 luminosity = 2; // уровень освещённости
}

// запись, представляющая данные с климатического датчика
message ClimateSensorProto {
  int32 temperature_c = 1; // температура в градусах Цельсия
  int32 humidity = 2; // уровень влажности
  int32 co2_level = 3; // уровень углекислого газа
}

// запись, представляющая данные с датчика переключателя
message SwitchSensorProto {
  bool state = 1; // текущее состояние переключателя (включено/выключено)
}

// запись, представляющая данные события, связанного с сенсором
message SensorEventProto {
  string id = 1; // идентификатор датчика
  google.protobuf.Timestamp timestamp = 2; // метка времени, указывающая, когда произошло событие телеметрии
  string hub_id = 3; // идентификатор хаба, к которому подключён сенсор
  oneof payload {
    MotionSensorProto motion_sensor = 4; // данные события датчика движения
    TemperatureSensorProto temperature_sensor = 5; // данные события температурного датчика
    LightSensorProto light_sensor = 6; // данные события датчика освещения
    ClimateSensorProto climate_sensor = 7; // данные события климатического датчика
    SwitchSensorProto switch_sensor = 8; // данные события датчика-переключателя
  }
}